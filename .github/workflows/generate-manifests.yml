name: Generate photo/poem manifests

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/photos/**"
      - "assets/poems/**"
      - "scripts/generate-manifests.mjs"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate manifests
        run: node scripts/generate-manifests.mjs

      - name: Commit changes (if any)
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/photos.json data/poems.json
          git commit -m "Auto-generate photos.json and poems.json"
          git push
