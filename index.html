<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Place</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      font-family: serif;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.6), rgba(0,0,0,0.95));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.6s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #overlay h1 {
      font-weight: normal;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    #overlay p {
      opacity: 0.8;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>Enter</h1>
    <p>Click to walk</p>
  </div>

  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.159.0/examples/js/controls/PointerLockControls.js"></script>

  <!-- Main Scene -->
  <script type="module" src="./main.js"></script>

</body>
</html>
